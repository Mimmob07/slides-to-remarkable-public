name: Self-test reMarkable and local conversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read configured layout mode
        id: config
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("config.toml").read_text())
          print("layout_mode=" + config.get("layout", {}).get("mode", "circuits"))
          PY
      - name: Check required secrets
        env:
          RMAPI_SECRET: ${{ secrets.RMAPI_CONFIG }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LAYOUT_MODE: ${{ steps.config.outputs.layout_mode }}
        run: |
          set -euo pipefail
          if [[ -z "$RMAPI_SECRET" ]]; then
            echo "Missing required secret: RMAPI_CONFIG (rmapi config file contents)." >&2
            exit 1
          fi
          if [[ "$LAYOUT_MODE" == "circuits" && -z "$CLAUDE_CODE_OAUTH_TOKEN" ]]; then
            echo "The circuits layout requires the CLAUDE_CODE_OAUTH_TOKEN secret." >&2
            exit 1
          fi
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install rmapi v0.0.35
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/ddvk/rmapi/releases/download/v0.0.35/rmapi-linux-amd64.tar.gz \
            --output "$RUNNER_TEMP/rmapi.tar.gz"
          tar -xzf "$RUNNER_TEMP/rmapi.tar.gz" -C "$RUNNER_TEMP" rmapi
          chmod 0755 "$RUNNER_TEMP/rmapi"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare private runtime config
        env:
          RMAPI_SECRET: ${{ secrets.RMAPI_CONFIG }}
        run: |
          umask 077
          printf '%s' "$RMAPI_SECRET" > "$RUNNER_TEMP/rmapi.conf"
          chmod 0600 "$RUNNER_TEMP/rmapi.conf"
          echo "RMAPI_CONFIG=$RUNNER_TEMP/rmapi.conf" >> "$GITHUB_ENV"
      - name: Check reMarkable connection without listing documents
        run: rmapi -ni ls / > /dev/null
      - name: Install Claude CLI
        if: ${{ steps.config.outputs.layout_mode == 'circuits' }}
        run: npm install --global @anthropic-ai/claude-code
      - name: Convert a synthetic PDF
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          LAYOUT_MODE: ${{ steps.config.outputs.layout_mode }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import pymupdf
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "slides2rm-selftest.pdf"
          doc = pymupdf.open()
          page = doc.new_page(width=612, height=792)
          page.insert_text((72, 72), "Synthetic conversion self-test: overview")
          page = doc.new_page(width=612, height=792)
          page.insert_text((72, 72), "Synthetic circuit")
          shape = page.new_shape()
          shape.draw_line((120, 180), (300, 180))
          shape.draw_rect(pymupdf.Rect(180, 165, 220, 195))
          shape.draw_line((220, 180), (300, 180))
          shape.finish(color=(0, 0, 0), width=1.5)
          shape.commit()
          doc.save(path)
          PY
          python slides2rm.py convert "$RUNNER_TEMP/slides2rm-selftest.pdf" \
            "$RUNNER_TEMP/slides2rm-selftest-output.pdf" --mode "$LAYOUT_MODE"
          python - <<'PY'
          import os
          import pymupdf
          from pathlib import Path
          output = Path(os.environ["RUNNER_TEMP"]) / "slides2rm-selftest-output.pdf"
          with pymupdf.open(output) as doc:
              assert len(doc) > 0, "converted PDF has no pages"
          PY
